<!doctype html><html><head><title>Admin · Empire of Tomorrow</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><div class="navin"><a class="brand" href="/"><span></span>Empire of Tomorrow</a><div class="links">
<a href="/">Announcements</a><a href="/members">Members</a><a href="/rules">Rules</a><a href="/cards-ranks">Cards & Ranks</a><a href="/about-us">About Us</a><a href="/oath">Oath</a>
</div></div></nav><main class="admin"><div class="adminbar"><div><div class="eyebrow">Private Dashboard</div><h1>Admin</h1></div><form method="post" action="/admin/logout"><button class="btn secondary">Log out</button></form></div><div class="admin-grid"><section class="card"><h2>New announcement</h2><form class="form" method="post" action="/admin/announcement/add"><input name="title" placeholder="Title" required><textarea name="body" placeholder="Announcement text" required></textarea><label><input type="checkbox" name="pinned"> Pin announcement</label><button class="btn">Publish</button></form><hr><h3>Existing</h3>{% for a in announcements %}<div class="card"><b>{{a.title}}</b><p>{{a.body}}</p><form method="post" action="/admin/announcement/delete/{{a.id}}"><button class="btn danger">Delete</button></form></div>{% endfor %}</section><section class="card"><h2>Add member</h2><form class="form" method="post" action="/admin/member/add"><input name="name" placeholder="Member name" required><input name="role" placeholder="Role" required><input name="special_name" placeholder="Special name"><input name="code" placeholder="Code"><button class="btn">Add member</button></form><hr><h3>Existing</h3>{% for m in members %}<div class="card"><b>{{m.name}}</b><p>{{m.role}} · {{m.special_name}}</p><form method="post" action="/admin/member/delete/{{m.id}}"><button class="btn danger">Delete</button></form></div>{% endfor %}</section></div></main></body></html>
