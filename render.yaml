services:
  - type: web
    name: empire-of-tomorrow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: empire-db
          property: connectionString
      - key: ADMIN_PASSWORD_HASH
        sync: false

databases:
  - name: empire-db
    databaseName: empire
    user: empire
